services:
  - type: web
    name: andrew2-api
    runtime: node
    plan: free
    branch: iac33-integration-next
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: node server/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
