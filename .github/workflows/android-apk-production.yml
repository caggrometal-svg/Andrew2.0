name: Android APK Production

on:
  workflow_dispatch:
  push:
    branches:
      - iac33-integration-next

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build web application
        run: npm run build

      - name: Ensure Android project exists
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Validate APK artifact
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          stat -c 'APK_SIZE_BYTES=%s' "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null

      - name: Publish latest GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view andrew-latest >/dev/null 2>&1; then
            gh release upload andrew-latest "$APK#andrew-latest.apk" --clobber
          else
            gh release create andrew-latest "$APK#andrew-latest.apk" \
              --target "$GITHUB_SHA" \
              --title "Andrew 2.0 latest APK" \
              --notes "Production APK generated and validated by GitHub Actions."
          fi

      - name: Verify direct GitHub Release download
        run: |
          URL="https://github.com/caggrometal-svg/Andrew2.0/releases/download/andrew-latest/andrew-latest.apk"
          curl -fL --retry 5 --retry-delay 2 -o /tmp/github-latest.apk "$URL"
          test -s /tmp/github-latest.apk
          file /tmp/github-latest.apk
          sha256sum /tmp/github-latest.apk

      - name: Verify production health endpoint
        run: |
          curl -fsS --retry 5 --retry-delay 3 --max-time 30 \
            -D /tmp/health.headers \
            -o /tmp/health.json \
            https://andrew2-api.onrender.com/health
          grep -Eq '^HTTP/.* 200 ' /tmp/health.headers
          cat /tmp/health.headers
          cat /tmp/health.json

      - name: Verify production APK download endpoint
        run: |
          URL="https://andrew2-api.onrender.com/download/andrew-latest.apk"
          curl -fL --retry 5 --retry-delay 3 --max-time 120 \
            -D /tmp/apk.headers \
            -o /tmp/andrew-latest.apk \
            "$URL"
          grep -Eq '^HTTP/.* 200 ' /tmp/apk.headers
          grep -qi '^content-type: application/vnd.android.package-archive' /tmp/apk.headers
          test -s /tmp/andrew-latest.apk
          file /tmp/andrew-latest.apk
          sha256sum /tmp/andrew-latest.apk
          unzip -t /tmp/andrew-latest.apk >/dev/null
          cat /tmp/apk.headers

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-production-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
