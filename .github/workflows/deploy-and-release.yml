name: Deploy and Release Andrew APK

on:
  push:
    branches:
      - iac33-integration-next
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: '20'
  ANDROID_WORKFLOW: android-apk.yml
  RELEASE_TAG: andrew-latest
  RELEASE_ASSET: andrew-latest.apk
  RENDER_DOWNLOAD_URL: https://andrew2-api.onrender.com/download/andrew-latest.apk

jobs:
  tests:
    name: Backend and application tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run full test suite
        run: npm test

  android-build:
    name: Require successful Android APK build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Android build workflow for this exact commit
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          run_id=''
          status=''
          conclusion=''

          while [ "$SECONDS" -lt "$deadline" ]; do
            json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$ANDROID_WORKFLOW" \
              --commit "$GITHUB_SHA" \
              --limit 10 \
              --json databaseId,status,conclusion \
              --jq '.[0] // empty')"

            if [ -n "$json" ]; then
              run_id="$(jq -r '.databaseId' <<<"$json")"
              status="$(jq -r '.status' <<<"$json")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$json")"
              echo "Android workflow run=$run_id status=$status conclusion=${conclusion:-pending}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "ERROR: Android APK workflow failed with conclusion=$conclusion"
                  exit 1
                fi
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              echo "Android APK workflow for $GITHUB_SHA has not started yet."
            fi

            sleep 15
          done

          echo 'ERROR: Timed out waiting for the Android APK workflow.'
          exit 1

      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-artifact
          mkdir -p release-artifact
          gh run download "${{ steps.wait.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Andrew2.0-debug-apk-${GITHUB_SHA}" \
            --dir release-artifact

          APK="$(find release-artifact -type f -name 'andrew-latest.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"

  release:
    name: Publish rolling GitHub Release
    needs: [tests, android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$ANDROID_WORKFLOW" \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "Andrew2.0-debug-apk-${GITHUB_SHA}" \
            --dir release

          APK="$(find release -type f -name 'andrew-latest.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" release/andrew-latest.apk
          sha256sum release/andrew-latest.apk > release/SHA256SUMS.txt
          unzip -t release/andrew-latest.apk >/dev/null

      - name: Create or update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Andrew 2.0 Latest APK
          target_commitish: ${{ github.sha }}
          body: |
            Rolling stable APK generated from `${{ github.sha }}` on `${{ github.ref_name }}`.
            APK source: successful `Build Android APK` workflow.
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/andrew-latest.apk
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    name: Verify Render APK endpoint
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke test download endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="$RENDER_DOWNLOAD_URL"
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"

          status="$(curl --silent --show-error --location \
            --max-time 90 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            --write-out '%{http_code}' \
            "$URL")"

          echo "HTTP status: $status"
          cat "$HEADERS"

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: download endpoint returned non-2xx status: $status"
            exit 1
          fi

          content_type="$(grep -i '^content-type:' "$HEADERS" | tail -n 1 | cut -d: -f2- | tr -d '\r' | xargs)"
          echo "Content-Type: $content_type"

          if [ "$content_type" != 'application/vnd.android.package-archive' ]; then
            echo "ERROR: unexpected Content-Type"
            exit 1
          fi

          if grep -qi '^HTTP/.* 503' "$HEADERS"; then
            echo 'ERROR: endpoint exposed a 503 response'
            exit 1
          fi

          test -s "$BODY"
          echo 'Render APK endpoint smoke test: PASS'
