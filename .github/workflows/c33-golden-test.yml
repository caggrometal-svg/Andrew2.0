name: C33 Golden Runtime Test

on:
  push:
    branches:
      - iac33-integration-next
    paths:
      - 'server/**'
      - 'src/network/**'
      - '.github/workflows/c33-golden-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render ready
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            body="$(curl -fsS --max-time 20 https://andrew2-api.onrender.com/health || true)"
            if printf '%s' "$body" | python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get("ok") is True and d.get("status")=="ready" else 1)' 2>/dev/null; then
              echo "GOLDEN: backend ready"
              exit 0
            fi
            sleep 20
          done
          echo "GOLDEN FAIL: backend never became ready"
          exit 1

      - name: Validate health contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://andrew2-api.onrender.com/health > /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert d.get('status') == 'ready'
          assert d.get('service') == 'andrew2-backend'
          ai=d.get('ai') or {}
          providers=ai.get('configuredProviders') or []
          assert providers, 'No configured providers'
          assert isinstance(ai.get('providers'), list) and ai['providers'], 'Provider diagnostics missing'
          print('GOLDEN health: PASS')
          print('providers:', ','.join(providers))
          PY

      - name: Validate chat response contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 120 \
            -H 'Content-Type: application/json' \
            -H 'X-Andrew-User-Id: ci-golden-test' \
            -H 'X-Andrew-App-Version: ci-golden' \
            -d '{"message":"C33 Golden Test: responde exactamente GOLDEN-C33","conversationId":"ci:golden"}' \
            https://andrew2-api.onrender.com/api/chat > /tmp/chat.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/chat.json'))
          assert isinstance(d.get('reply'), str) and d['reply'].strip(), 'Empty reply'
          assert isinstance(d.get('provider'), str) and d['provider'].strip(), 'Missing provider'
          assert isinstance(d.get('model'), str) and d['model'].strip(), 'Missing model'
          assert isinstance(d.get('attempts'), int) and d['attempts'] >= 1, 'Invalid attempts'
          print('GOLDEN chat: PASS')
          print('provider:',d['provider'])
          print('model:',d['model'])
          print('attempts:',d['attempts'])
          print('reply_nonempty: PASS')
          PY

      - name: Recovery probe
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://andrew2-api.onrender.com/health > /tmp/health2.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health2.json'))
          assert d.get('ok') is True and d.get('status') == 'ready'
          ai=d.get('ai') or {}
          assert ai.get('configuredProviders'), 'Providers disappeared after chat'
          print('GOLDEN recovery: PASS')
          PY

      - name: Golden certification
        run: echo 'C33 GOLDEN TEST: PASS'