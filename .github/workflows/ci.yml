name: Phase 4 Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Phase 4 Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify repository hygiene
        run: |
          test ! -f .env
          test ! -f .env.local
          ! grep -RInE 'sk-[A-Za-z0-9_-]{20,}' . --exclude-dir=.git --exclude='*.md' || (echo 'Potential API secret found in tracked source' && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Directed IAC33 runtime integration
        run: npm run test:regression

      - name: Full Vitest regression
        run: npm test

      - name: Production build
        run: npm run build
