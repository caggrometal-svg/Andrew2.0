name: Phase 4 Release Gate

on:
  push:
    branches: [main, iac33-integration-next, foundation-strangler]
  pull_request:
    branches: [main, iac33-integration-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Foundation + Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint isolated core
        run: npm run lint

      - name: Typecheck isolated core
        run: npm run typecheck:core

      - name: Typecheck legacy workspace
        run: npm run typecheck

      - name: Directed IAC33 runtime integration
        run: npm run test:regression

      - name: Core unit tests
        run: npm run test:core

      - name: Golden-master parity
        run: npm run test:parity

      - name: Full Vitest regression
        run: npm test

      - name: Production build
        run: npm run build
