name: Phase 4 Release Gate

on:
  push:
    branches: [iac33-integration-next]
  pull_request:
    branches: [iac33-integration-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Phase 4 Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Directed IAC33 runtime integration
        run: npm run test:regression

      - name: Server and bridge tests
        run: npm run test:server

      - name: Full Vitest regression
        run: npm test

      - name: Production build
        run: npm run build
