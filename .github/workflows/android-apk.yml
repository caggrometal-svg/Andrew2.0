name: Build Android APK

on:
  push:
    branches:
      - andrew-backend-openai-v1
      - iac33-integration-next
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Keep every Android build independently executable and observable.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Andrew 2.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 31
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NODE_ENV: test
      CI: true
      CAPACITOR_ANDROID_VERSION: 7.4.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Build web app
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Install Android tooling
        uses: android-actions/setup-android@v3
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor Android
        run: npm install @capacitor/android@7.4.4 --no-save
      - name: Add/sync Android
        run: |
          npx cap add android || true
          npx cap sync android
      - name: Install Android bridge
        run: node scripts/install-android-bridge.mjs
      - name: Verify Android bridge
        run: |
          test -f android/app/src/main/java/com/andrew/editor/AndrewBridge.java
          test -f android/app/src/main/java/com/andrew/editor/MainActivity.java
      - name: Build Android APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --info --console=plain --warning-mode=all
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p release
          cp "$APK" release/andrew-2.0-${GITHUB_SHA}.apk
          cp "$APK" release/andrew-latest.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-debug-apk-${{ github.sha }}
          path: release/
          if-no-files-found: error
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "andrew-${GITHUB_SHA}" release/andrew-2.0-${GITHUB_SHA}.apk release/SHA256SUMS.txt --title "Andrew 2.0 ${GITHUB_SHA}" --notes "Automated APK build from ${GITHUB_SHA}."
      - name: Publish andrew-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view andrew-latest >/dev/null 2>&1 && gh release delete andrew-latest --yes || true
          gh release create andrew-latest release/andrew-latest.apk release/SHA256SUMS.txt --title "Andrew 2.0 latest" --notes "Automated latest APK from ${GITHUB_SHA}."
      - name: Verify GitHub release asset
        run: |
          curl -fL --retry 3 -o /tmp/andrew-latest.apk https://github.com/caggrometal-svg/Andrew2.0/releases/download/andrew-latest/andrew-latest.apk
          test -s /tmp/andrew-latest.apk
          unzip -t /tmp/andrew-latest.apk >/dev/null
          sha256sum /tmp/andrew-latest.apk
      - name: Verify Render health
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://andrew2-api.onrender.com/health
      - name: Verify Render APK proxy
        run: |
          curl -fsS --retry 5 --retry-delay 5 -D /tmp/render.headers -o /tmp/render.apk https://andrew2-api.onrender.com/download/andrew-latest.apk
          grep -i '^content-type: application/vnd.android.package-archive' /tmp/render.headers
          test -s /tmp/render.apk
          unzip -t /tmp/render.apk >/dev/null
          sha256sum /tmp/render.apk
