name: Build Android APK

on:
  push:
    branches:
      - andrew-backend-openai-v1
      - iac33-integration-next
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CAPACITOR_VERSION: '7.4.4'

jobs:
  build-apk:
    name: Build Andrew 2.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.caching=false
      JAVA_TOOL_OPTIONS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=512m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Assert pinned Capacitor toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.dependencies['@capacitor/core']!=='${CAPACITOR_VERSION}' || p.dependencies['@capacitor/android']!=='${CAPACITOR_VERSION}' || p.devDependencies['@capacitor/cli']!=='${CAPACITOR_VERSION}') process.exit(1)"
          npm ls @capacitor/cli @capacitor/core @capacitor/android --depth=0

      - name: Build web application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Android platform if missing
        run: |
          set -euo pipefail
          test -f capacitor.config.ts
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install Phase 23 native Android bridge
        run: node scripts/install-android-bridge.mjs

      - name: Configure deterministic Gradle build
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Force compatible Kotlin stdlib versions
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
            configurations.configureEach {
              resolutionStrategy.force(
                'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
            }
          }
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Clean Android and Gradle state
        working-directory: ./android
        run: |
          ./gradlew --stop || true
          rm -rf .gradle build app/build

      - name: Validate Gradle environment
        working-directory: ./android
        run: |
          java -version
          ./gradlew --version --no-daemon

      - name: Build Debug APK with automatic retry
        working-directory: ./android
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            echo "Gradle build attempt ${attempt}/2"
            ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode=all && exit 0
            ./gradlew --stop || true
            rm -rf .gradle build app/build
            sleep 5
          done
          exit 1

      - name: Verify APK output and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          unzip -t "$APK" >/tmp/apk-zip-test.txt
          unzip -Z1 "$APK" >/tmp/apk-files.txt
          grep -Fxq 'AndroidManifest.xml' /tmp/apk-files.txt
          grep -Fxq 'classes.dex' /tmp/apk-files.txt
          grep -Fxq 'resources.arsc' /tmp/apk-files.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Deep inspect APK Manifest and Android bridge
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee /tmp/andrew-apk-badging.txt
          grep -q "package:" /tmp/andrew-apk-badging.txt
          grep -q "application:" /tmp/andrew-apk-badging.txt
          grep -q "launchable-activity:" /tmp/andrew-apk-badging.txt
          grep -q "uses-permission:.*android.permission.INTERNET" /tmp/andrew-apk-badging.txt
          if [ -x "$APKANALYZER" ]; then "$APKANALYZER" manifest permissions "$APK" | grep -q "android.permission.INTERNET"; fi
          mapfile -t DEX_FILES < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$' | sort -V)
          test "${#DEX_FILES[@]}" -gt 0
          BRIDGE_DEX_MATCHES=0
          MAIN_ACTIVITY_DEX_MATCHES=0
          for DEX in "${DEX_FILES[@]}"; do
            DEX_STRINGS="$(unzip -p "$APK" "$DEX" | strings || true)"
            if printf '%s\n' "$DEX_STRINGS" | grep -Fq "AndrewBridge"; then BRIDGE_DEX_MATCHES=$((BRIDGE_DEX_MATCHES + 1)); fi
            if printf '%s\n' "$DEX_STRINGS" | grep -Fq "MainActivity"; then MAIN_ACTIVITY_DEX_MATCHES=$((MAIN_ACTIVITY_DEX_MATCHES + 1)); fi
          done
          test "$BRIDGE_DEX_MATCHES" -ge 1
          test "$MAIN_ACTIVITY_DEX_MATCHES" -ge 1

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/andrew-2.0-${GITHUB_SHA}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk release/andrew-latest.apk
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: andrew-debug-apk-${{ github.sha }}
          path: |
            release/andrew-2.0-${{ github.sha }}.apk
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: andrew-${{ github.sha }}
          name: Andrew 2.0 ${{ github.sha }}
          body: |
            Immutable APK release generated from `${{ github.sha }}` on `${{ github.ref_name }}`.
            The APK was ZIP-tested, manifest-inspected and bridge-inspected before publication.
          prerelease: true
          make_latest: false
          files: |
            release/andrew-2.0-${{ github.sha }}.apk
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: andrew-latest
          name: Andrew 2.0 Latest APK
          body: |
            Latest verified APK generated from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Verification: ZIP integrity, Android manifest, INTERNET permission, MainActivity and AndrewBridge.
            SHA-256 is included in `SHA256SUMS.txt`.
          prerelease: true
          make_latest: true
          files: |
            release/andrew-latest.apk
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
