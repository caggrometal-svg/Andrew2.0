name: Build Android APK

on:
  push:
    branches:
      - andrew-backend-openai-v1
      - iac33-integration-next
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Andrew 2.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=512m
        -Dfile.encoding=UTF-8
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.caching=false
      JAVA_TOOL_OPTIONS: >-
        -Xmx4g
        -XX:MaxMetaspaceSize=512m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install Phase 23 native Android bridge
        run: node scripts/install-android-bridge.mjs

      - name: Configure deterministic Gradle build
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.caching=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Force compatible Kotlin stdlib versions
        run: |
          cat >> android/build.gradle <<'EOF'

          allprojects {
            configurations.configureEach {
              resolutionStrategy.force(
                'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
                'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              )
            }
          }
          EOF

      - name: Grant Gradle execute permission
        run: chmod +x android/gradlew

      - name: Clean Android and Gradle state
        working-directory: ./android
        run: |
          ./gradlew --stop || true
          rm -rf .gradle build app/build

      - name: Validate Gradle environment
        working-directory: ./android
        run: |
          java -version
          ./gradlew --version --no-daemon

      - name: Build Debug APK with automatic retry
        working-directory: ./android
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2; do
            echo "Gradle build attempt ${attempt}/2"
            ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode=all && exit 0
            echo "Gradle attempt ${attempt} failed"
            ./gradlew --stop || true
            rm -rf .gradle build app/build
            sleep 5
          done
          echo "Gradle build failed after 2 attempts"
          exit 1

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK missing: $APK"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "APK is empty: $APK"
            exit 1
          fi

          echo "APK: $APK"
          ls -lh "$APK"
          sha256sum "$APK"

          unzip -t "$APK" > /tmp/apk-zip-test.txt
          tail -n 2 /tmp/apk-zip-test.txt

          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -Fxq 'AndroidManifest.xml' /tmp/apk-files.txt
          grep -Fxq 'classes.dex' /tmp/apk-files.txt
          grep -Fxq 'resources.arsc' /tmp/apk-files.txt

          echo "APK output verification -> PASS"
          echo "Required APK entries -> PASS"

      - name: Deep inspect APK Manifest and Android bridge
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"

          test -x "$AAPT2"
          echo "Using AAPT2: $AAPT2"
          "$AAPT2" dump badging "$APK" | tee /tmp/andrew-apk-badging.txt
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" | tee /tmp/andrew-apk-manifest-tree.txt >/dev/null

          grep -q "package:" /tmp/andrew-apk-badging.txt
          grep -q "application:" /tmp/andrew-apk-badging.txt
          grep -q "launchable-activity:" /tmp/andrew-apk-badging.txt
          grep -q "uses-permission:'android.permission.INTERNET'" /tmp/andrew-apk-badging.txt

          echo "Required Android permission: INTERNET -> PASS"

          if [ -x "$APKANALYZER" ]; then
            "$APKANALYZER" manifest permissions "$APK" | tee /tmp/andrew-apk-permissions.txt
            grep -q "android.permission.INTERNET" /tmp/andrew-apk-permissions.txt
            echo "apkanalyzer manifest permission check -> PASS"
          else
            echo "apkanalyzer unavailable; AAPT2 remains authoritative for manifest validation"
          fi

          echo "Checking Phase 23 native bridge in DEX files"
          BRIDGE_DEX_MATCHES=0
          while IFS= read -r DEX; do
            if unzip -p "$APK" "$DEX" | strings | grep -q "AndrewBridge"; then
              echo "AndrewBridge found in $DEX"
              BRIDGE_DEX_MATCHES=$((BRIDGE_DEX_MATCHES + 1))
            fi
            if unzip -p "$APK" "$DEX" | strings | grep -q "MainActivity"; then
              echo "MainActivity found in $DEX"
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$')
          test "$BRIDGE_DEX_MATCHES" -ge 1
          echo "AndrewBridge class present -> PASS"
          echo "MainActivity bridge host present -> PASS"

          echo "Manifest structural checks -> PASS"
          echo "APK ZIP integrity -> PASS"
          echo "APK deep inspection -> PASS"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: andrew-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
