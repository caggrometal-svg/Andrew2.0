name: Andrew 3.0 CI

on:
  workflow_dispatch:
  push:
    branches:
      - andrew-3.0
      - iac33-integration-next
      - iac33-dev
  pull_request:
    branches:
      - andrew-3.0
      - iac33-integration-next
      - iac33-dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: andrew
          POSTGRES_PASSWORD: andrew
          POSTGRES_DB: andrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U andrew -d andrew_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://andrew:andrew@127.0.0.1:5432/andrew_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci

      - name: Foundation invariants
        run: npm run verify:foundation

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Syntax-check backend
        run: |
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/routes/chat.mjs
          node --check server/routes/telemetry.mjs
          node --check server/server.mjs
