name: Andrew 3.0 CI

on:
  push:
    branches:
      - andrew-3.0
      - iac33-integration-next
      - iac33-dev
  pull_request:
    branches:
      - andrew-3.0
      - iac33-integration-next
      - iac33-dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Foundation invariants
        run: npm run verify:foundation

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Syntax-check backend
        run: |
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/routes/chat.mjs
          node --check server/routes/telemetry.mjs
          node --check server/server.mjs
