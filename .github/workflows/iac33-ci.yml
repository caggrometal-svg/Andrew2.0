name: IAC33 CI

on:
  push:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1
  pull_request:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Syntax-check backend
        run: |
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/routes/chat.mjs
          node --check server/server.mjs
