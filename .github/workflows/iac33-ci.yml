name: IAC33 CI

on:
  push:
    branches:
      - main
      - iac33-integration-v2
  pull_request:
    branches:
      - main
      - iac33-integration-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
        env:
          CI: true
      - name: Production build
        run: npm run build
