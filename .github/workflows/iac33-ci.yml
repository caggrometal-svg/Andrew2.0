name: IAC33 CI

on:
  push:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1
      - phase25-bridge-security
  pull_request:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: andrew_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d andrew_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Syntax-check backend
        run: |
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/ai/provider-router.mjs
          node --check server/routes/chat.mjs
          node --check server/routes/bridge-v3.mjs
          node --check server/routes/bridge-pairing.mjs
          node --check server/bridge/bridge-auth.mjs
          node --check server/bridge/bridge-identity-store.mjs
          node --check server/bridge/bridge-controller.mjs
          node --check server/bridge/bridge-result-ai.mjs
          node --check server/server.mjs

      - name: Phase 25 native node:test suites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/andrew_test
          DATABASE_SSL: disable
        run: |
          node --test \
            tests/phase25-bridge-security-v2.test.mjs \
            tests/phase25-http-e2e.test.mjs \
            tests/phase25-http-real-e2e.test.mjs

      - name: Phase 25 Vitest suites
        run: |
          npx vitest run \
            tests/phase25-remote-bridge-loop.test.ts \
            tests/phase29-e2e-bridge.test.mjs

      - name: Android bridge executor gate
        run: npx vitest run tests/phase21-android-bridge-executor.test.ts tests/phase22-capacitor-bridge.test.ts tests/phase23-native-android-bridge.test.ts

      - name: AI to Android bridge controller gate
        run: npm run test:phase24

      - name: Provider resilience gate
        run: npx vitest run tests/phase26-provider-resilience.test.mjs

      - name: Multi-provider registry gate
        run: npx vitest run tests/phase27-provider-registry.test.mjs

      - name: Provider recovery and capability gate
        run: npx vitest run tests/phase28-provider-recovery.test.mjs

      - name: Full AI regression gate
        run: npx vitest run tests/phase26-provider-resilience.test.mjs tests/phase27-provider-registry.test.mjs tests/phase28-provider-recovery.test.mjs
