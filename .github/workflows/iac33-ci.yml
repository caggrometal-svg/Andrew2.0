name: IAC33 CI

on:
  push:
    branches: [main, iac33-integration-v2]
  pull_request:
    branches: [main, iac33-integration-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Setup Node → Install → Typecheck → Vitest → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
        env:
          CI: true
      - name: Production build
        run: npm run build
