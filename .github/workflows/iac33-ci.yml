name: IAC33 CI

on:
  push:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1
  pull_request:
    branches:
      - iac33-integration-next
      - iac33-dev
      - andrew-backend-openai-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Syntax-check backend
        run: |
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/ai/provider-router.mjs
          node --check server/routes/chat.mjs
          node --check server/routes/bridge-v3.mjs
          node --check server/bridge/bridge-controller.mjs
          node --check server/server.mjs

      - name: AI to Android bridge controller gate
        run: npm run test:phase24

      - name: APK remote bridge loop gate
        run: npx vitest run tests/phase25-remote-bridge-loop.test.ts

      - name: Provider resilience gate
        run: npx vitest run tests/phase26-provider-resilience.test.mjs

      - name: Multi-provider registry gate
        run: npx vitest run tests/phase27-provider-registry.test.mjs

      - name: Provider recovery and capability gate
        run: npx vitest run tests/phase28-provider-recovery.test.mjs

      - name: Full AI regression gate
        run: npx vitest run tests/phase26-provider-resilience.test.mjs tests/phase27-provider-registry.test.mjs tests/phase28-provider-recovery.test.mjs
