name: IAC33 CI

on:
  push:
    branches:
      - iac33-integration-next
      - iac33-dev
  pull_request:
    branches:
      - iac33-integration-next
      - iac33-dev

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
