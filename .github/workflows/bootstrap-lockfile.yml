name: Bootstrap dependency lockfile

on:
  push:
    branches:
      - iac33-integration-next
  workflow_dispatch:

concurrency:
  group: bootstrap-lockfile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: false

      - name: Generate and validate lockfile
        shell: bash
        run: |
          set -euo pipefail
          if test -s package-lock.json; then
            echo 'package-lock.json already exists; validating it with npm ci.'
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain -- package-lock.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: add deterministic npm lockfile'
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo 'package-lock.json already synchronized.'
          fi
