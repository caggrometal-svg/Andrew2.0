name: Bootstrap dependency lockfile

on:
  push:
    branches:
      - iac33-integration-next
  workflow_dispatch:

concurrency:
  group: bootstrap-lockfile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate lockfile only when absent
        shell: bash
        run: |
          set -euo pipefail
          if test -s package-lock.json; then
            echo 'package-lock.json already exists; no bootstrap mutation required.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add deterministic npm lockfile'
          git push origin HEAD:${GITHUB_REF_NAME}
