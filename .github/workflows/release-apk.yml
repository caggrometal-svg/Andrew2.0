name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create when running manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Andrew2.0
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Verify protected timeline core
        shell: bash
        run: |
          EXPECTED_SHA="75395fbeab1549d1ae5978cc407eacf47b20c7db"
          ACTUAL_SHA="$(git hash-object src/editor/timeline/timeline-store.ts)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "timeline-store.ts: UNTOUCHED ($ACTUAL_SHA)"

      - name: Build and test Android APK
        run: npm run build:apk

      - name: Verify generated APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK verified: $APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Andrew2.0 ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
