name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - iac33-integration-next

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Bridge security and foundation tests
        run: |
          npx vitest run tests/phase25-bridge-security.test.mjs tests/phase25-remote-bridge-loop.test.ts tests/phase29-e2e-bridge.test.mjs
          npm run test:phase19
          npm run test:phase20
          npm run test:phase21
          npm run test:phase22
          npm run test:phase23
          npm run test:phase24
          npx vitest run tests/phase26-provider-resilience.test.mjs tests/phase27-provider-registry.test.mjs tests/phase28-provider-recovery.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Install native Andrew bridge
        run: node scripts/install-android-bridge.mjs

      - name: Prepare production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          chmod 600 android/release.keystore
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('android/app/build.gradle')
          text = path.read_text()
          if 'signingConfigs {' not in text:
              marker = re.search(r'(?m)^\s*buildTypes\s*\{', text)
              if not marker:
                  raise SystemExit('buildTypes block not found in android/app/build.gradle')
              block = '''    signingConfigs {
          release {
              storeFile file("../release.keystore")
              storePassword System.getenv("STORE_PASSWORD")
              keyAlias System.getenv("KEY_ALIAS")
              keyPassword System.getenv("KEY_PASSWORD")
          }
      }

'''
              text = text[:marker.start()] + block + text[marker.start():]
          release = re.search(r'(?m)^(\s*)release\s*\{', text)
          if not release:
              raise SystemExit('release buildType not found in android/app/build.gradle')
          start = release.end()
          if 'signingConfig signingConfigs.release' not in text[start:start + 800]:
              indent = release.group(1) + '    '
              text = text[:start] + f'\n{indent}signingConfig signingConfigs.release' + text[start:]
          path.write_text(text)
          PY

      - name: Verify Java and Gradle
        working-directory: android
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version

      - name: Build signed release APK
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Verify signed release APK
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$apk"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          "$signer" verify --print-certs "$apk"
          sha256sum "$apk" | tee android/app/build/outputs/apk/release/app-release.apk.sha256
          echo "Verified release APK: $apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-release-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
