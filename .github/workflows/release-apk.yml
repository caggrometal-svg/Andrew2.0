name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - iac33-integration-next
      - foundation-strangler

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preserve Bridge V3 native sources
        shell: bash
        run: |
          if [ -d android/app/src/main/java/com/andrew/app/bridge/v3 ]; then
            mkdir -p .bridge-native
            cp -R android/app/src/main/java/com/andrew/app/bridge/v3 .bridge-native/bridge-v3
            rm -rf android
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Restore Bridge V3 native sources
        shell: bash
        run: |
          if [ -d .bridge-native/bridge-v3 ]; then
            mkdir -p android/app/src/main/java/com/andrew/app/bridge/v3
            cp -R .bridge-native/bridge-v3/. android/app/src/main/java/com/andrew/app/bridge/v3/
          fi

      - name: Add Bridge V3 Android dependencies
        shell: bash
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text()
          dependency = '    implementation "androidx.work:work-runtime-ktx:2.11.2"\n'
          if dependency not in text:
              marker = 'dependencies {'
              if marker not in text:
                  raise SystemExit('dependencies block not found')
              text = text.replace(marker, marker + '\n' + dependency, 1)
              path.write_text(text)
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Java and Gradle
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
