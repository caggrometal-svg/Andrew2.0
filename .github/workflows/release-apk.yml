name: Android APK

on:
  push:
    branches:
      - andrew-editor-v1
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Andrew2.0
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify protected timeline core
        shell: bash
        run: |
          EXPECTED_SHA="75395fbeab1549d1ae5978cc407eacf47b20c7db"
          ACTUAL_SHA="$(git hash-object src/editor/timeline/timeline-store.ts)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "timeline-store.ts: UNTOUCHED ($ACTUAL_SHA)"

      - name: Build and test Android APK
        run: npm run build:apk

      - name: Verify generated APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK verified: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Andrew2.0 ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
