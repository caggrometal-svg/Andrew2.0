name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - iac33-integration-next

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Frontend
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

      - name: Security audit report
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preserve Bridge V3 native sources
        shell: bash
        run: |
          test -d android/app/src/main/java/com/andrew/app/bridge/v3
          mkdir -p .bridge-native/bridge-v3
          cp -R android/app/src/main/java/com/andrew/app/bridge/v3/. .bridge-native/bridge-v3/
          rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Restore Bridge V3 native sources
        shell: bash
        run: |
          test -d .bridge-native/bridge-v3
          mkdir -p android/app/src/main/java/com/andrew/app/bridge/v3
          cp -R .bridge-native/bridge-v3/. android/app/src/main/java/com/andrew/app/bridge/v3/

      - name: Verify Bridge V3 source tree
        shell: bash
        run: |
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/AndrewBridgeCommandWorker.kt
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/AndrewSyncWorker.kt
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/DeviceKeyStoreSigner.kt
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/BridgeCommandDispatcher.kt
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/AndrewSyncBridge.kt
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/LocalRuntimeConfig.kt
          grep -q '^package com.andrew.app.bridge.v3' android/app/src/main/java/com/andrew/app/bridge/v3/AndrewBridgeCommandWorker.kt
          grep -q '@JvmStatic' android/app/src/main/java/com/andrew/app/bridge/v3/AndrewBridgeCommandWorker.kt

      - name: Enable Kotlin compilation for Bridge V3
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('build.gradle')
          text = root.read_text()
          buildscript = '''buildscript {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
              dependencies {
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
              }
          }
          '''
          if 'org.jetbrains.kotlin:kotlin-gradle-plugin' not in text:
              text = buildscript + '\n' + text
              root.write_text(text)

          app = Path('app/build.gradle')
          text = app.read_text()
          if "apply plugin: 'kotlin-android'" not in text and 'id "org.jetbrains.kotlin.android"' not in text and "id 'org.jetbrains.kotlin.android'" not in text:
              text = "apply plugin: 'kotlin-android'\n" + text
          dependency = '    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"\n'
          if dependency not in text:
              marker = 'dependencies {'
              if marker not in text:
                  raise SystemExit('dependencies block not found')
              text = text.replace(marker, marker + '\n' + dependency, 1)
          work = '    implementation "androidx.work:work-runtime-ktx:2.11.2"\n'
          if work not in text:
              marker = 'dependencies {'
              if marker not in text:
                  raise SystemExit('dependencies block not found')
              text = text.replace(marker, marker + '\n' + work, 1)
          app.write_text(text)
          PY

      - name: Wire Bridge V3 command scheduler into generated MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android/app/src/main/java')
          files = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if len(files) != 1:
              raise SystemExit(f'expected exactly one generated MainActivity, found {len(files)}')
          path = files[0]
          text = path.read_text()
          marker = 'AndrewBridgeCommandWorker.schedule(this)'
          if marker in text:
              raise SystemExit('Bridge V3 scheduler already wired')
          if path.suffix == '.kt':
              needle = 'class MainActivity : BridgeActivity() {'
              if needle not in text:
                  raise SystemExit('unexpected Kotlin MainActivity shape')
              replacement = needle + '\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        super.onCreate(savedInstanceState)\n        com.andrew.app.bridge.v3.AndrewBridgeCommandWorker.schedule(this)\n    }'
          else:
              needle = 'public class MainActivity extends BridgeActivity {'
              if needle not in text:
                  raise SystemExit('unexpected Java MainActivity shape')
              replacement = needle + '\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        com.andrew.app.bridge.v3.AndrewBridgeCommandWorker.schedule(this);\n    }'
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Bridge V3 after Capacitor sync
        shell: bash
        run: |
          test -f android/app/src/main/java/com/andrew/app/bridge/v3/AndrewBridgeCommandWorker.kt
          grep -q 'AndrewBridgeCommandWorker.schedule' android/app/src/main/java/**/MainActivity.* 2>/dev/null || grep -R -q 'AndrewBridgeCommandWorker.schedule' android/app/src/main/java

      - name: Grant execute permission for Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Java and Gradle
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kotlin bridge
        working-directory: android
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Andrew2.0-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload security audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit.json
          if-no-files-found: warn
