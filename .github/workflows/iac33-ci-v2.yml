name: IAC33 CI v2
on:
  push:
    branches: [iac33-integration-v2]
  pull_request:
    branches: [main, iac33-integration-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
        env:
          CI: true
      - run: npm run build
