name: Andrew Web Bridge Sync

on:
  push:
    branches: [iac33-integration-next]
    paths-ignore:
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-web-sync:
    name: Build, sign and publish web runtime
    runs-on: ubuntu-latest
    env:
      RENDER_SERVICE_ID: srv-dah3a615efls73fr3ii0
      RENDER_API_BASE: https://api.render.com/v1
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      BRIDGE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.BRIDGE_SIGNING_PRIVATE_KEY_PEM }}

    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4

      - name: Validate bridge secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY" || { echo 'RENDER_API_KEY secret missing'; exit 1; }
          test -n "$BRIDGE_SIGNING_PRIVATE_KEY_PEM" || { echo 'BRIDGE_SIGNING_PRIVATE_KEY_PEM secret missing'; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web runtime
        run: npm run build

      - name: Create signed bridge artifact
        shell: bash
        run: |
          set -euo pipefail
          revision='${GITHUB_SHA}'
          work="$RUNNER_TEMP/andrew-bridge"
          rm -rf "$work"
          mkdir -p "$work/payload"
          cp -R dist/. "$work/payload/"
          printf '{"ok":true,"revisionId":"%s"}\n' "$revision" > "$work/payload/health.json"
          (cd "$work/payload" && zip -qr "$work/andrew-web-runtime.zip" .)
          sha256=$(sha256sum "$work/andrew-web-runtime.zip" | awk '{print $1}')
          printf '%s' "$BRIDGE_SIGNING_PRIVATE_KEY_PEM" > "$work/signing-key.pem"
          printf '%s' "$sha256" | xxd -r -p > "$work/digest.bin"
          openssl dgst -sha256 -sign "$work/signing-key.pem" -out "$work/signature.der" "$work/digest.bin"
          signature=$(base64 -w0 "$work/signature.der")
          printf '%s\n' "$signature" > "$work/signature.txt"
          echo "BRIDGE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "BRIDGE_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "BRIDGE_SIGNATURE=$signature" >> "$GITHUB_ENV"
          echo "BRIDGE_ARTIFACT=$work/andrew-web-runtime.zip" >> "$GITHUB_ENV"

      - name: Publish immutable bridge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="bridge-${BRIDGE_REVISION}"
          gh release create "$tag" "$BRIDGE_ARTIFACT#andrew-web-runtime.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Andrew web runtime ${BRIDGE_REVISION}" \
            --notes "Signed web runtime for Andrew 2.0 bridge. Revision ${BRIDGE_REVISION}. SHA-256 ${BRIDGE_SHA256}."

      - name: Publish manifest to Render
        shell: bash
        run: |
          set -euo pipefail
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/bridge-${BRIDGE_REVISION}/andrew-web-runtime.zip"
          manifest=$(jq -cn \
            --arg revisionId "$BRIDGE_REVISION" \
            --arg sha256Hex "$BRIDGE_SHA256" \
            --arg signatureBase64 "$BRIDGE_SIGNATURE" \
            --arg downloadUrl "$download_url" \
            '{revisionId:$revisionId,previousRevisionId:null,sha256Hex:$sha256Hex,signatureBase64:$signatureBase64,downloadUrl:$downloadUrl}')
          payload=$(jq -cn \
            --arg manifest "$manifest" \
            '{envVars:[{key:"BRIDGE_ARTIFACT_MANIFEST_JSON",value:$manifest},{key:"BRIDGE_V3_ALLOW_WRITE",value:"true"}]}')
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --url "$RENDER_API_BASE/services/$RENDER_SERVICE_ID/env-vars" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload"

      - name: Deploy bridge manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$RENDER_API_BASE/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear","commitId":"'"${GITHUB_SHA}"'"}'

      - name: Verify bridge health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl --connect-timeout 5 --max-time 10 --output /tmp/health.json --write-out '%{http_code}' --silent https://andrew2-api.onrender.com/health || true)
            if [ "$code" = '200' ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo 'Render bridge health did not reach HTTP 200'
          exit 1
