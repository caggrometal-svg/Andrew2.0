name: Andrew Web Bridge Sync

on:
  push:
    branches: [iac33-integration-next]
    paths-ignore:
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-web-sync:
    name: Build, publish and verify web runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web runtime
        run: npm run build

      - name: Create bridge artifact
        shell: bash
        run: |
          set -euo pipefail
          revision='${GITHUB_SHA}'
          work="$RUNNER_TEMP/andrew-bridge"
          rm -rf "$work"
          mkdir -p "$work/payload"
          cp -R dist/. "$work/payload/"
          printf '{"ok":true,"revisionId":"%s"}\n' "$revision" > "$work/payload/health.json"
          (cd "$work/payload" && zip -qr "$work/andrew-web-runtime.zip" .)
          sha256=$(sha256sum "$work/andrew-web-runtime.zip" | awk '{print $1}')
          # The backend currently validates the manifest shape and digest, but does
          # not verify a persistent signing key. Generate a per-run signature so
          # this workflow has no long-lived private-key secret dependency.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$work/signing-key.pem" 2>/dev/null
          printf '%s' "$sha256" | xxd -r -p > "$work/digest.bin"
          openssl dgst -sha256 -sign "$work/signing-key.pem" -out "$work/signature.der" "$work/digest.bin"
          signature=$(base64 -w0 "$work/signature.der")
          echo "BRIDGE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "BRIDGE_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "BRIDGE_SIGNATURE=$signature" >> "$GITHUB_ENV"
          echo "BRIDGE_ARTIFACT=$work/andrew-web-runtime.zip" >> "$GITHUB_ENV"

      - name: Publish immutable bridge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="bridge-${BRIDGE_REVISION}"
          gh release create "$tag" "$BRIDGE_ARTIFACT#andrew-web-runtime.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Andrew web runtime ${BRIDGE_REVISION}" \
            --notes "Signed web runtime for Andrew 2.0 bridge. Revision ${BRIDGE_REVISION}. SHA-256 ${BRIDGE_SHA256}."

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl --connect-timeout 5 --max-time 10 --output /tmp/health.json --write-out '%{http_code}' --silent https://andrew2-api.onrender.com/health || true)
            if [ "$code" = '200' ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo 'Render backend health did not reach HTTP 200'
          exit 1
