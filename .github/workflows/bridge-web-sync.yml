name: Andrew Web Bridge Sync

on:
  push:
    branches: [iac33-integration-next]
    paths-ignore:
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRIDGE_TAG_PREFIX: bridge-

jobs:
  bridge-web-sync:
    name: Build, publish and verify web runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web runtime
        run: npm run build
      - name: Create bridge artifact
        shell: bash
        env:
          BRIDGE_ECDSA_PRIVATE_KEY_B64: ${{ secrets.BRIDGE_ECDSA_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          revision="${GITHUB_SHA}"
          work="$RUNNER_TEMP/andrew-bridge"
          rm -rf "$work"
          mkdir -p "$work/payload"
          trap 'rm -f "$work/signing-key.pem" "$work/signing-key.raw" "$work/digest.bin" "$work/signature.der" "$work/public-key.pem"' EXIT
          cp -R dist/. "$work/payload/"
          printf '{"ok":true,"revisionId":"%s"}\n' "$revision" > "$work/payload/health.json"
          ( cd "$work/payload" && zip -qr "$work/andrew-web-runtime.zip" . )
          sha256="$(sha256sum "$work/andrew-web-runtime.zip" | awk '{print $1}')"
          test -n "$BRIDGE_ECDSA_PRIVATE_KEY_B64"
          if printf '%s' "$BRIDGE_ECDSA_PRIVATE_KEY_B64" | grep -q -- '-----BEGIN'; then
            printf '%s\n' "$BRIDGE_ECDSA_PRIVATE_KEY_B64" | sed 's/\\n/\n/g' > "$work/signing-key.pem"
          else
            encoded="$(printf '%s' "$BRIDGE_ECDSA_PRIVATE_KEY_B64" | tr -d '[:space:]' | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')"
            test -n "$encoded"
            rem=$(( ${#encoded} % 4 ))
            if [ "$rem" -ne 0 ]; then encoded="${encoded}$(printf '%*s' $((4-rem)) '' | tr ' ' '=')"; fi
            printf '%s' "$encoded" | base64 --decode > "$work/signing-key.raw"
            if openssl pkey -in "$work/signing-key.raw" -check -noout >/dev/null 2>&1; then
              cp "$work/signing-key.raw" "$work/signing-key.pem"
            elif openssl pkey -inform DER -in "$work/signing-key.raw" -check -noout >/dev/null 2>&1; then
              openssl pkey -inform DER -in "$work/signing-key.raw" -out "$work/signing-key.pem"
            else
              echo 'BRIDGE_ECDSA_PRIVATE_KEY_B64 is neither a readable PEM key nor a supported DER private key.' >&2
              exit 1
            fi
          fi
          chmod 600 "$work/signing-key.pem"
          openssl pkey -in "$work/signing-key.pem" -check -noout
          key_type="$(openssl pkey -in "$work/signing-key.pem" -text -noout 2>/dev/null | grep -m1 'ASN1 OID:' | sed 's/.*ASN1 OID: //')"
          test "$key_type" = "prime256v1"
          printf '%s' "$sha256" | xxd -r -p > "$work/digest.bin"
          openssl dgst -sha256 -sign "$work/signing-key.pem" -out "$work/signature.der" "$work/digest.bin"
          signature="$(base64 -w0 "$work/signature.der")"
          openssl pkey -in "$work/signing-key.pem" -pubout -out "$work/public-key.pem"
          openssl dgst -sha256 -verify "$work/public-key.pem" -signature "$work/signature.der" "$work/digest.bin"
          echo "ECDSA-P256/SHA256 artifact signature verified locally."
          echo "BRIDGE_REVISION=$revision" >> "$GITHUB_ENV"
          echo "BRIDGE_SHA256=$sha256" >> "$GITHUB_ENV"
          echo "BRIDGE_SIGNATURE=$signature" >> "$GITHUB_ENV"
          echo "BRIDGE_ARTIFACT=$work/andrew-web-runtime.zip" >> "$GITHUB_ENV"
      - name: Publish immutable bridge artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${BRIDGE_TAG_PREFIX}${BRIDGE_REVISION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$BRIDGE_ARTIFACT#andrew-web-runtime.zip" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Andrew web runtime ${BRIDGE_REVISION}" --notes "Signed web runtime for Andrew 2.0 bridge. Revision ${BRIDGE_REVISION}. SHA-256 ${BRIDGE_SHA256}."
          else
            gh release create "$tag" "$BRIDGE_ARTIFACT#andrew-web-runtime.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Andrew web runtime ${BRIDGE_REVISION}" --notes "Signed web runtime for Andrew 2.0 bridge. Revision ${BRIDGE_REVISION}. SHA-256 ${BRIDGE_SHA256}."
          fi
      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl --connect-timeout 5 --max-time 10 --output /tmp/health.json --write-out '%{http_code}' --silent https://andrew2-api.onrender.com/health || true)
            if [ "$code" = '200' ]; then cat /tmp/health.json; exit 0; fi
            sleep 10
          done
          echo 'Render backend health did not reach HTTP 200'
          exit 1
