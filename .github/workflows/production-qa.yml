name: Production QA

on:
  workflow_dispatch:
  push:
    branches:
      - iac33-integration-next

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://andrew2-api.onrender.com
      ALLOWED_ORIGIN: https://proyecto-andrew-loca-ev02.bolt.host
      CHAT_CONVERSATION_ID: phase1-qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -sS "$BASE_URL/health" || true)"
            if [ -n "$body" ]; then
              echo "$body" | jq .
              if [ "$(echo "$body" | jq -r '.ok')" = "true" ] && \
                 [ "$(echo "$body" | jq -r '.status')" = "healthy" ] && \
                 [ "$(echo "$body" | jq -r '.checks.openaiApiKeyConfigured')" = "true" ] && \
                 [ "$(echo "$body" | jq -r '.checks.server')" = "ok" ] && \
                 [ "$(echo "$body" | jq -r '.checks.mediaRuntime')" = "ok" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'HEALTH GATE FAILED'
          exit 1

      - name: Production chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl -sS --connect-timeout 10 --max-time 45 -w '\n%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Origin: $ALLOWED_ORIGIN" \
              -X POST "$BASE_URL/api/chat" \
              --data "{\"message\":\"QA_PRODUCTION_SMOKE_ANSWER_ONLY\",\"conversationId\":\"$CHAT_CONVERSATION_ID\"}" || true)"
            code="$(printf '%s\n' "$response" | tail -n1)"
            body="$(printf '%s\n' "$response" | sed '$d')"
            echo "ATTEMPT=$attempt HTTP=$code"
            if [ -n "$body" ]; then echo "$body" | jq . || printf '%s\n' "$body"; fi
            if [ "$code" = "200" ] && \
               [ "$(echo "$body" | jq -r '.ok' 2>/dev/null || echo false)" = "true" ] && \
               [ -n "$(echo "$body" | jq -r '.reply' 2>/dev/null || true)" ] && \
               [ -n "$(echo "$body" | jq -r '.responseId' 2>/dev/null || true)" ]; then
              exit 0
            fi
            if [ "$code" = "502" ] || [ "$code" = "503" ] || [ "$code" = "504" ] || [ "$code" = "000" ]; then
              sleep 5
              continue
            fi
            exit 1
          done
          echo 'PRODUCTION CHAT SMOKE FAILED AFTER RETRIES'
          exit 1

      - name: CORS rejection check
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null -X OPTIONS "$BASE_URL/api/chat" \
            -H 'Origin: https://malicious-origin.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          echo "$headers"
          if printf '%s\n' "$headers" | grep -Eiq '^access-control-allow-origin:[[:space:]]*https://malicious-origin\.com[[:space:]]*$'; then
            echo 'CORS FAILURE: malicious origin was allowed'
            exit 1
          fi

      - name: Telemetry rate-limit check
        shell: bash
        run: |
          set -euo pipefail
          hit=0
          for i in $(seq 1 65); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "$BASE_URL/api/telemetry" \
              --data '{"event":"qa_rate_limit","source":"ci"}')"
            echo "REQ=$i HTTP=$code"
            if [ "$code" = "429" ]; then hit=1; break; fi
          done
          test "$hit" = "1"

      - name: Backend static validation
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm run build
          npm ls --depth=0
          node --check server/server.mjs
          node --check server/config.mjs
          node --check server/openai.mjs
          node --check server/routes/chat.mjs
          node --check server/routes/telemetry.mjs
          node --check server/security/distributed-rate-limit.mjs

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Full dependency audit report
        shell: bash
        run: |
          npm audit --json > audit-full.json || true
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('audit-full.json','utf8'));console.log(JSON.stringify(a.metadata||{},null,2))"

      - name: PHASE 1 GREEN GATE
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'iac33-integration-next'
          test "$GITHUB_SHA" != ''
          echo 'PHASE_1=GREEN'
          echo 'PHASE_2_UNLOCK=true'
