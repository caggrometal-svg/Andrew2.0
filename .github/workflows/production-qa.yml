name: Production QA

on:
  workflow_dispatch:
  push:
    branches:
      - iac33-integration-next

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://andrew2-api.onrender.com
      ALLOWED_ORIGIN: https://proyecto-andrew-loca-ev02.bolt.host

    steps:
      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/health")"
          echo "$body" | jq .
          test "$(echo "$body" | jq -r '.ok')" = "true"
          test "$(echo "$body" | jq -r '.status')" = "healthy"
          test "$(echo "$body" | jq -r '.checks.openai.configured')" = "true"

      - name: Production chat smoke test
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 2 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -H "Origin: $ALLOWED_ORIGIN" \
            -X POST "$BASE_URL/api/chat" \
            --data '{"message":"QA_PRODUCTION_SMOKE_ANSWER_ONLY"}')"
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.ok')" = "true"
          test -n "$(echo "$response" | jq -r '.reply')"
          test -n "$(echo "$response" | jq -r '.responseId')"

      - name: CORS rejection check
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS -D - -o /dev/null -X OPTIONS "$BASE_URL/api/chat" \
            -H 'Origin: https://malicious-origin.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          echo "$headers"
          if printf '%s\n' "$headers" | grep -qi 'access-control-allow-origin: https://malicious-origin.com'; then
            echo 'CORS FAILURE: malicious origin was allowed'
            exit 1
          fi

      - name: Telemetry rate-limit check
        shell: bash
        run: |
          set -euo pipefail
          hit=0
          for i in $(seq 1 65); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST "$BASE_URL/api/telemetry" \
              --data '{"event":"qa_rate_limit","source":"ci"}')"
            echo "REQ=$i HTTP=$code"
            if [ "$code" = "429" ]; then
              hit=1
              break
            fi
          done
          test "$hit" = "1"

      - name: Backend static validation
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          npm install
          npm run typecheck
          npm run build
          npm ls --depth=0

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
