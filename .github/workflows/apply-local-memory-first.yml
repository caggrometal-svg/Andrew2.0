name: Apply local memory first

on:
  push:
    branches:
      - fix/local-memory-first-rpd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch local memory behavior
        run: python3 scripts/apply-local-memory-first.py

      - name: Verify source
        run: |
          grep -q 'localMemoryReply' src/ui/App.tsx
          grep -q 'IA limitada' src/ui/App.tsx
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run test:server
          npm run build

      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/App.tsx
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: make local memory commands independent of AI quota'
          git push
