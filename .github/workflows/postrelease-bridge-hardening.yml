name: Post-release Android Bridge Hardening Gate

on:
  push:
    branches: [iac33-postrelease-android-bridge-hardening]
  pull_request:
    branches: [iac33-integration-next]

jobs:
  bridge-hardening:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: iac33
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d iac33"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/iac33
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bridge-hardening
      - run: npm run test:phase14
      - run: npm run test:phase13
      - run: npm test
      - run: echo POST_RELEASE_BRIDGE_HARDENING_GREEN
