name: Phase 18 Android Bridge Gateway Gate

on:
  push:
    branches: [iac33-integration-next]
  pull_request:
    branches: [iac33-integration-next]
  workflow_dispatch:

jobs:
  phase18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:phase18
      - run: npm run test:phase17
      - run: npm run test:phase16
      - name: Run provider-router certification
        id: router_test
        continue-on-error: true
        run: npx vitest run tests/provider-router-failover.test.mjs > provider-router-test.log 2>&1
      - name: Upload provider-router diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-router-test-${{ github.run_id }}
          path: provider-router-test.log
      - name: Enforce provider-router certification
        if: steps.router_test.outcome != 'success'
        run: exit 1
      - run: echo PHASE_18_GREEN_GATE
