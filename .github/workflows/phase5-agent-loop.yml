name: Phase 5 Agent Loop Gate

on:
  workflow_dispatch:
  push:
    branches:
      - iac33-phase5-agent-loop
  pull_request:
    branches:
      - iac33-integration-next

jobs:
  phase5-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: andrew2_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d andrew2_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/andrew2_learning
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Phase 5 Agent Loop
        run: npx vitest run tests/phase5-agent-loop.test.ts
      - name: Phase 2 regression
        run: npm run test:memory
      - name: Phase 3 regression
        run: npm run test:learning
      - name: Phase 4 regression
        run: npm run test:phase4
      - name: Full regression
        run: npm test
      - name: PHASE 5 GREEN GATE
        run: |
          set -euo pipefail
          echo 'PHASE_1_REGRESSION=GREEN'
          echo 'PHASE_2_REGRESSION=GREEN'
          echo 'PHASE_3_CONTROLLED_LEARNING=GREEN'
          echo 'PHASE_4_TOOL_ROUTER=GREEN'
          echo 'PHASE_5_AGENT_LOOP=GREEN'
