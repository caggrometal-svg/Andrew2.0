name: Phase 19 Android Bridge Persistence Gate

on:
  push:
    branches: [iac33-integration-next]
  pull_request:
    branches: [iac33-integration-next]
  workflow_dispatch:

jobs:
  phase19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:phase19
      - run: npm run test:phase18
      - run: npm run test:phase17
      - run: npm run test:phase16
      - run: echo PHASE_19_GREEN_GATE
