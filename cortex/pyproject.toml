[project]
name = "andrew-cortex"
version = "0.1.0"
description = "Andrew 2.0 Cortex: async AI orchestration, semantic cache, RAG and resilient model routing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "redis[hiredis]>=5.2,<6",
  "qdrant-client>=1.12,<2",
  "litellm>=1.75,<2",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "anyio>=4.6,<5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
