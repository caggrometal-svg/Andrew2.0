services:
  cortex:
    build:
      context: ..
      dockerfile: cortex/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    env_file: .env
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
    command:
      - "--model"
      - "${LOCAL_MODEL}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--enable-prefix-caching"
      - "--gpu-memory-utilization"
      - "0.90"
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  hf-cache:
